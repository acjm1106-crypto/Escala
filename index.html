<div class="max-w-6xl mx-auto bg-white dark:bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-200 dark:border-slate-700">
    
    <!-- Header -->
    <header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white p-6 sm:p-8 relative">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <span class="inline-block px-3 py-1 bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 rounded-full text-xs font-semibold tracking-wide uppercase mb-2">
                    Painel de Controle de Som
                </span>
                <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight">ESCALA DE OUTUBRO – 2026</h1>
                <p class="text-indigo-200/80 mt-1 text-sm sm:text-base font-medium">Equipe de Operadores de Som</p>
            </div>

            <div class="flex flex-wrap items-center gap-2 self-start md:self-auto">
                <button id="themeToggle" class="p-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-all border border-white/10 text-sm flex items-center gap-2 cursor-pointer" title="Alternar tema">
                    <span id="themeIcon">🌙</span>
                    <span class="hidden sm:inline text-xs font-semibold" id="themeText">Escuro</span>
                </button>

                <button id="photoModalBtn" class="px-3 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white font-semibold text-xs transition-all border border-white/10 flex items-center gap-1.5 cursor-pointer" title="Alterar fotos dos operadores">
                    <span>📷</span>
                    <span class="hidden sm:inline">Alterar Fotos</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="p-4 sm:p-8 space-y-6">
       
        <!-- Controls Bar -->
        <div class="flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-4 bg-slate-50 dark:bg-slate-800/60 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
            <!-- Search Input -->
            <div class="w-full lg:w-80 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    🔍
                </span>
                <input type="text" id="searchInput" placeholder="Buscar por operador, dia ou data..." class="w-full pl-10 pr-4 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white text-sm transition-all shadow-sm">
            </div>

            <!-- Operator Filter Pills -->
            <div class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-2 lg:pb-0" id="operatorPills">
                <button data-operator="Todos" class="operator-pill px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-indigo-600 text-white shadow-sm cursor-pointer">
                    Todos
                </button>
                <button data-operator="Davi" class="operator-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center gap-1.5 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">
                    <span>Davi</span>
                </button>
                <button data-operator="Fábio" class="operator-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center gap-1.5 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">
                    <span>Fábio</span>
                </button>
                <button data-operator="Guinho" class="operator-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center gap-1.5 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">
                    <span>Guinho</span>
                </button>
                <button data-operator="João" class="operator-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center gap-1.5 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">
                    <span>João</span>
                </button>
                <button data-operator="Zildo" class="operator-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center gap-1.5 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">
                    <span>Zildo</span>
                </button>
            </div>

            <!-- Turn Counter -->
            <div class="text-xs text-slate-600 dark:text-slate-300 font-semibold bg-white dark:bg-slate-900 px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm shrink-0 flex items-center justify-between lg:justify-start">
                <span>Turnos Exibidos:</span>
                <span id="turnCount" class="font-extrabold text-indigo-600 dark:text-indigo-400 text-sm ml-2">0</span>
            </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm custom-scrollbar">
            <table id="escalaTable" class="w-full text-left border-collapse min-w-[600px]">
                <thead>
                    <tr class="bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 text-xs font-bold uppercase tracking-wider border-b border-slate-200 dark:border-slate-700 select-none">
                        <th class="py-3.5 px-4 cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" onclick="sortTable(0)">Dia da Semana <span class="text-slate-400">↕</span></th>
                        <th class="py-3.5 px-4 cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" onclick="sortTable(1)">Data <span class="text-slate-400">↕</span></th>
                        <th class="py-3.5 px-4 cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" onclick="sortTable(2)">Período <span class="text-slate-400">↕</span></th>
                        <th class="py-3.5 px-4 cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" onclick="sortTable(3)">Operador(es) <span class="text-slate-400">↕</span></th>
                        <th class="py-3.5 px-4 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-700 text-sm" id="tableBody">
                    <!-- Rows injected via JS -->
                </tbody>
            </table>
        </div>

    </div>

    <footer class="bg-slate-50 dark:bg-slate-900/50 p-4 text-center text-xs text-slate-500 border-t border-slate-200 dark:border-slate-700">
        Escala Interativa de Operadores de Som &bull; Outubro 2026
    </footer>
</div>

<!-- Modal for Photo Settings -->
<div id="photoModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Gerenciar Fotos dos Operadores</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400">Insira a URL da foto para cada operador da equipe:</p>
        <div class="space-y-3 max-h-60 overflow-y-auto pr-1">
            <div>
                <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Davi</label>
                <input type="text" data-op="Davi" class="photo-input w-full mt-1 px-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg dark:text-white" placeholder="URL da imagem">
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Fábio</label>
                <input type="text" data-op="Fábio" class="photo-input w-full mt-1 px-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg dark:text-white" placeholder="URL da imagem">
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Guinho</label>
                <input type="text" data-op="Guinho" class="photo-input w-full mt-1 px-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg dark:text-white" placeholder="URL da imagem">
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">João</label>
                <input type="text" data-op="João" class="photo-input w-full mt-1 px-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg dark:text-white" placeholder="URL da imagem">
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Zildo</label>
                <input type="text" data-op="Zildo" class="photo-input w-full mt-1 px-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg dark:text-white" placeholder="URL da imagem">
            </div>
        </div>
        <div class="flex justify-end gap-2 pt-2">
            <button id="closeModal" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold hover:bg-slate-300 transition-all cursor-pointer">Fechar</button>
            <button id="savePhotos" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-700 transition-all cursor-pointer">Salvar</button>
        </div>
    </div>
</div>

<script>
    // Sample October 2026 schedule data
    const escalaData = [
        { dia: "Sexta-feira", data: "02/10/2026", periodo: "Noite", operadores: ["Davi", "Guinho"] },
        { dia: "Domingo", data: "04/10/2026", periodo: "Manhã", operadores: ["Fábio", "João"] },
        { dia: "Domingo", data: "04/10/2026", periodo: "Noite", operadores: ["Zildo", "Davi"] },
        { dia: "Quarta-feira", data: "07/10/2026", periodo: "Noite", operadores: ["Guinho", "Fábio"] },
        { dia: "Sexta-feira", data: "09/10/2026", periodo: "Noite", operadores: ["João", "Zildo"] },
        { dia: "Domingo", data: "11/10/2026", periodo: "Manhã", operadores: ["Davi", "Fábio"] },
        { dia: "Domingo", data: "11/10/2026", periodo: "Noite", operadores: ["Guinho", "João"] },
        { dia: "Quarta-feira", data: "14/10/2026", periodo: "Noite", operadores: ["Zildo", "Davi"] },
        { dia: "Sexta-feira", data: "16/10/2026", periodo: "Noite", operadores: ["Fábio", "Guinho"] },
        { dia: "Domingo", data: "18/10/2026", periodo: "Manhã", operadores: ["João", "Zildo"] },
        { dia: "Domingo", data: "18/10/2026", periodo: "Noite", operadores: ["Davi", "Guinho"] },
        { dia: "Quarta-feira", data: "21/10/2026", periodo: "Noite", operadores: ["Fábio", "Zildo"] },
        { dia: "Sexta-feira", data: "23/10/2026", periodo: "Noite", operadores: ["João", "Davi"] },
        { dia: "Domingo", data: "25/10/2026", periodo: "Manhã", operadores: ["Guinho", "Zildo"] },
        { dia: "Domingo", data: "25/10/2026", periodo: "Noite", operadores: ["Fábio", "João"] },
        { dia: "Quarta-feira", data: "28/10/2026", periodo: "Noite", operadores: ["Davi", "Zildo"] },
        { dia: "Sexta-feira", data: "30/10/2026", periodo: "Noite", operadores: ["Guinho", "João"] }
    ];

    let currentFilter = "Todos";
    let searchQuery = "";
    let operatorPhotos = JSON.parse(localStorage.getItem('operatorPhotos')) || {};

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";

        const filtered = escalaData.filter(item => {
            const matchesOperator = currentFilter === "Todos" || item.operadores.includes(currentFilter);
            const query = searchQuery.toLowerCase();
            const matchesSearch = item.dia.toLowerCase().includes(query) ||
                                  item.data.toLowerCase().includes(query) ||
                                  item.periodo.toLowerCase().includes(query) ||
                                  item.operadores.some(op => op.toLowerCase().includes(query));
            return matchesOperator && matchesSearch;
        });

        document.getElementById('turnCount').textContent = filtered.length;

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">Nenhum turno encontrado.</td></tr>`;
            return;
        }

        filtered.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.className = "bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-750 transition-colors";

            let opsHtml = item.operadores.map(op => {
                const photo = operatorPhotos[op] || `https://api.dicebear.com/7.x/avataaars/svg?seed=${op}`;
                return `
                    <span class="inline-flex items-center gap-1.5 mr-1.5 my-1 bg-slate-100 dark:bg-slate-700/80 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 hover:border-indigo-300 transition-all px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-600 shadow-sm cursor-pointer group">
                        <img src="${photo}" alt="${op}" class="w-5 h-5 rounded-full object-cover bg-indigo-100">
                        <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">${op}</span>
                    </span>
                `;
            }).join('');

            tr.innerHTML = `
                <td class="py-3.5 px-4 font-semibold text-slate-700 dark:text-slate-200">${item.dia}</td>
                <td class="py-3.5 px-4 text-slate-600 dark:text-slate-300 font-medium whitespace-nowrap">${item.data}</td>
                <td class="py-3.5 px-4">
                    <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-indigo-50 text-indigo-700 dark:bg-indigo-950/50 dark:text-indigo-300 border border-indigo-200/50 dark:border-indigo-800/50">
                        ${item.periodo}
                    </span>
                </td>
                <td class="py-2 px-4">${opsHtml}</td>
                <td class="py-3.5 px-4 text-center">
                    <button onclick="editTurn(${index})" class="p-1.5 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer" title="Editar Turno">
                        ✏️
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Search listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderTable();
    });

    // Filter operator pills
    document.querySelectorAll('.operator-pill').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.operator-pill').forEach(b => {
                b.className = "operator-pill px-3 py-1.5 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center gap-1.5 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer";
            });
            btn.className = "operator-pill px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-indigo-600 text-white shadow-sm cursor-pointer";
            currentFilter = btn.getAttribute('data-operator');
            renderTable();
        });
    });

    // Theme Toggle
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    function setTheme(isDark) {
        if (isDark) {
            document.documentElement.classList.add('dark');
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Claro';
            localStorage.setItem('theme', 'dark');
        } else {
            document.documentElement.classList.remove('dark');
            themeIcon.textContent = '🌙';
            themeText.textContent = 'Escuro';
            localStorage.setItem('theme', 'light');
        }
    }

    themeToggle.addEventListener('click', () => {
        const isDark = !document.documentElement.classList.contains('dark');
        setTheme(isDark);
    });

    // Initial theme check
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        setTheme(true);
    }

    // Modal handling
    const modal = document.getElementById('photoModal');
    document.getElementById('photoModalBtn').addEventListener('click', () => {
        document.querySelectorAll('.photo-input').forEach(input => {
            const op = input.getAttribute('data-op');
            input.value = operatorPhotos[op] || '';
        });
        modal.classList.remove('hidden');
    });

    document.getElementById('closeModal').addEventListener('click', () => {
        modal.classList.add('hidden');
    });

    document.getElementById('savePhotos').addEventListener('click', () => {
        document.querySelectorAll('.photo-input').forEach(input => {
            const op = input.getAttribute('data-op');
            if (input.value.trim()) {
                operatorPhotos[op] = input.value.trim();
            } else {
                delete operatorPhotos[op];
            }
        });
        localStorage.setItem('operatorPhotos', JSON.stringify(operatorPhotos));
        modal.classList.add('hidden');
        renderTable();
    });

    function editTurn(index) {
        const item = escalaData[index];
        const newOps = prompt(`Editar operadores para ${item.dia} (${item.data}) [Separados por vírgula]:`, item.operadores.join(', '));
        if (newOps !== null) {
            item.operadores = newOps.split(',').map(s => s.trim()).filter(Boolean);
            renderTable();
        }
    }

    let sortDirection = false;
    function sortTable(columnIndex) {
        sortDirection = !sortDirection;
        const keys = ['dia', 'data', 'periodo', 'operadores'];
        const key = keys[columnIndex];

        escalaData.sort((a, b) => {
            let valA = key === 'operadores' ? a.operadores.join() : a[key];
            let valB = key === 'operadores' ? b.operadores.join() : b[key];
            return sortDirection ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });
        renderTable();
    }

    // Initial render
    renderTable();
</script>
